name: Build MP3ConverterAPI

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Baixar FFmpeg (win64-gpl)
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Force ffmpeg.zip ffmpeg_tmp
          New-Item -ItemType Directory -Force -Path vendor/ffmpeg/win64 | Out-Null
          Get-ChildItem -Recurse ffmpeg_tmp -Include ffmpeg.exe,ffprobe.exe | ForEach-Object { Copy-Item $_.FullName vendor/ffmpeg/win64/ -Force }

      - name: Compilar executavel
        run: python -m PyInstaller --clean --noconfirm MP3ConverterAPI.spec

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: MP3ConverterAPI-win64
          path: dist/MP3ConverterAPI.exe
